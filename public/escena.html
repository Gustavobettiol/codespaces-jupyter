<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Escena</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:system-ui,sans-serif;color:#fff}
.stage{position:absolute;left:40px;top:40px;width:1080px;height:900px;border-radius:24px;overflow:hidden;background:#12121c;box-shadow:0 30px 80px #000a}
.stage img,.stage video{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:flex;align-items:center;justify-content:center;height:100%;color:#4a4a5e;font-size:22px}
.np{position:absolute;left:40px;top:40px;padding:18px 30px;border-radius:0 0 20px 0;background:linear-gradient(90deg,#74ACDF,#4a90d9);color:#04121f}
.np b{font-size:38px;display:block;line-height:1}.np span{font-size:16px;font-weight:600;opacity:.75}
.live{position:absolute;left:1080px;top:52px;display:flex;gap:10px;align-items:center;background:#e11d48;padding:8px 18px;border-radius:100px;font-weight:800;font-size:18px}
.dot{width:11px;height:11px;border-radius:50%;background:#fff;animation:p 1.1s infinite}@keyframes p{50%{opacity:.25}}
.side{position:absolute;right:40px;top:110px;width:720px;height:700px;background:#0a0a12cc;backdrop-filter:blur(14px);border-radius:24px;border:1px solid #ffffff1a;display:flex;flex-direction:column;overflow:hidden}
.side h3{font-size:16px;text-transform:uppercase;letter-spacing:2px;color:#74ACDF;padding:18px 24px 12px;border-bottom:1px solid #ffffff12}
#chat{flex:1;overflow:hidden;padding:14px 24px;display:flex;flex-direction:column;justify-content:flex-end;gap:9px}
.msg{font-size:23px;line-height:1.35}.msg b{color:#ff3d81}.msg.she{background:#ffffff0d;border-left:4px solid #74ACDF;border-radius:0 12px 12px 0;padding:9px 14px}
.thumbs{display:flex;gap:10px;padding:14px 24px;border-top:1px solid #ffffff12}
.thumbs img{width:96px;height:128px;object-fit:cover;border-radius:12px;border:2px solid #ff3d81}
.ticker{position:absolute;left:0;bottom:0;width:100%;height:64px;background:#0a0a12e6;border-top:2px solid #74ACDF;display:flex;align-items:center;overflow:hidden}
.ticker span{font-size:26px;white-space:nowrap;animation:t 24s linear infinite;padding-left:100%}@keyframes t{to{transform:translateX(-100%)}}
</style></head><body>
<div class="stage"><div class="ph" id="ph">esperando la primera foto…</div><img id="foto" style="display:none"><video id="clip" style="display:none" autoplay muted loop playsinline></video></div>
<div class="np"><b id="pn">Camila</b><span id="pm">25 · Palermo, Buenos Aires</span></div>
<div class="live"><span class="dot"></span> EN VIVO</div>
<div class="side"><h3>Chat</h3><div id="chat"></div><div class="thumbs" id="th"></div></div>
<div class="ticker"><span id="tk">Escribí /presentar en Telegram para que aparezca acá</span></div>
<script>
const $=i=>document.getElementById(i);
const P=new URLSearchParams(location.search);
const KEY=P.get("key")||"";
const API=P.get("api")||"";
const abs=u=>/^https?:/.test(u)?u:API+u;
function chat(h,ella){const d=document.createElement("div");d.className="msg"+(ella?" she":"");d.innerHTML=h;$("chat").appendChild(d);while($("chat").children.length>9)$("chat").firstChild.remove()}
function media(u,v){u=abs(u);$("ph").style.display="none";$("foto").style.display="none";$("clip").style.display="none";
 if(v){$("clip").src=u;$("clip").style.display="block"}else{$("foto").src=u;$("foto").style.display="block"}
 const t=document.createElement("img");t.src=u;$("th").appendChild(t);while($("th").children.length>6)$("th").firstChild.remove()}
new EventSource(API+"/events?key="+KEY).onmessage=e=>{const d=JSON.parse(e.data);
 if(d.tipo==="chat")chat("<b>"+d.autor+":</b> "+d.texto,0);
 if(d.tipo==="ella")chat(d.texto,1);
 if(d.tipo==="media")media(d.url,d.video);
 if(d.tipo==="personaje"){$("pn").textContent=d.nombre;$("pm").textContent=d.meta}
 if(d.tipo==="ticker")$("tk").textContent=d.texto};
</script></body></html>
